<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.png" type="image/x-png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portail VIP | Espace Réservé</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Styles personnalisés -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

  <!-- Arrière-plan lumineux et ambiant -->
  <div class="ambient-glow">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
  </div>

  <!-- Carte Centrale d'Authentification -->
  <main class="container position-relative z-1" style="max-width: 480px;">
    <div class="glass-panel p-4 p-md-5 text-center fade-in-up">

      <!-- Badge VIP -->
      <div class="mb-4">
        <span class="badge-vip">
          <i class="bi bi-stars"></i> Accès VIP Exclusif
        </span>
      </div>

      <!-- Icône de Cadenas stylisée -->
      <div class="d-inline-flex align-items-center justify-content-center mb-3 rounded-circle shadow-sm"
        style="width: 76px; height: 76px; background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(226, 232, 240, 0.9);">
        <i id="lockIcon" class="bi bi-lock-fill text-gradient fs-1"></i>
      </div>

      <!-- Titre et sous-titre -->
      <h1 class="h3 fw-bold mb-2 text-dark">Salon Privé d'Anniversaire</h1>
      <p class="text-muted small mb-4">
        Veuillez vous authentifier pour débloquer les surprises réservés à l'invité(e) d'honneur.
      </p>

      <!-- Message de statut / feedback -->
      <div id="feedbackMsg" class="small mb-3" style="min-height: 24px;"></div>

      <!-- Formulaire -->
      <form id="authForm" class="text-start">

        <!-- Champ Prénom -->
        <div class="mb-3">
          <label for="nameInput" class="form-label small fw-semibold text-secondary">
            <i class="bi bi-person-heart me-1 text-pink"></i> Votre Prénom
          </label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"
              style="border-color: rgba(203, 213, 225, 0.85); border-radius: 14px 0 0 14px;">
              <i class="bi bi-person"></i>
            </span>
            <input type="text" class="form-control form-glass border-start-0 ps-0" id="nameInput"
              placeholder="   Prénom" autocomplete="name" style="border-radius: 0 14px 14px 0;">
          </div>
        </div>

        <!-- Champ Mot de passe secret -->
        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center">
            <label for="passInput" class="form-label small fw-semibold text-secondary mb-1">
              <i class="bi bi-key-fill me-1 text-gold"></i> Code Secret
            </label>
            <button type="button" class="btn btn-link p-0 text-gold text-decoration-none small fw-semibold"
              data-bs-toggle="collapse" data-bs-target="#hintBox" aria-expanded="false" aria-controls="hintBox"
              style="font-size: 0.82rem;">
              <i class="bi bi-lightbulb"></i> Indice ?
            </button>
          </div>

          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"
              style="border-color: rgba(203, 213, 225, 0.85); border-radius: 14px 0 0 14px;">
              <i class="bi bi-shield-lock"></i>
            </span>
            <input type="password" class="form-control form-glass border-start-0 border-end-0 px-0" id="passInput"
              placeholder="   Code secret" autocomplete="current-password">
            <button class="btn bg-white text-secondary border-start-0" type="button" id="togglePassBtn"
              style="border-color: rgba(203, 213, 225, 0.85); border-radius: 0 14px 14px 0;" title="Afficher/masquer">
              <i class="bi bi-eye"></i>
            </button>
          </div>

          <!-- Indice dépliable -->
          <div class="collapse mt-2" id="hintBox">
            <div class="p-2 rounded small"
              style="background: rgba(254, 243, 199, 0.9); border: 1px dashed rgba(245, 158, 11, 0.6); color: #92400e;">
              <i class="bi bi-magic me-1"></i> Mettre le mot de <strong>passe personnel</strong> reçu dans la lettre </div>
            </div>
          </div>

          <!-- Bouton de connexion -->
          <button type="submit" id="submitBtn" class="btn btn-festive w-100 py-3 mb-3 fw-bold fs-6">
            <i class="bi bi-box-arrow-in-right me-1"></i> Déverrouiller la Surprise
          </button>

          <!-- Pied de carte -->
          <footer class="mt-4 pt-3 border-top text-muted small">
            <i class="bi bi-balloon-heart text-danger me-1"></i> Spécialement préparé pour un jour unique
          </footer>
        </div>
  </main>

  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Script d'authentification -->
  <script src="js/auth.js"></script>
</body>

</html>
